name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install cryptography requests pytest httpx

      - name: Run Backend Integration & Unit Tests
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_KEY: "test_service_role_key_for_ci_pipeline"
          SNAPCHAT_CLIENT_ID: "ci_test_client_id"
          SNAPCHAT_CLIENT_SECRET: "ci_test_client_secret"
          SNAPCHAT_REDIRECT_URI: "https://reels-dashboard.vercel.app/api/snapchat/oauth/callback"
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build
